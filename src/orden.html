<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <title>Ordenes APP ORM</title>
  </head>
  <body>
    <nav class="nav">
      <ul class="menu__list">
        <li class="menu__item">
          <a class="menu__link" href="index.html">Productos</a>
        </li>
        <li class="menu__item">
          <a class="menu__link menu__link--current" href="orden.html">Ordenes</a>
        </li>
      </ul>
      <button class="nav__button">
        <figure class="nav__avatar-wrap">
          <img class="nav__avatar" src="https://i.pravatar.cc/300?img=0" alt="Foto de Perfil">
        </figure>
        <p class="nav__name">Nombre<br>Apellido</p>
      </button>
    </nav>
    <main class="page">
      <ul id="orders-list" class="orders__list"></ul>
      <button id="cart-open" class="cart__open">Comprar Carrito</button>
      <dialog id="cart-dialog" class="cart__dialog">
        <button id="cart-close" class="cart__close">x</button>
        <p class="cart__title">Carrito</p>
        <ul id="cart-list" class="cart__list"></ul>
        <button id="cart-submit" class="cart__submit">Comprar</button>
      </dialog>
    </main>

    <script type="module" src="./scripts/orden.js"></script>
    <script type="module" src="/scripts/user.js"></script>
  </body>
</html>
