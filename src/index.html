<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <h1>Products</h1>
  <ul id="list"></ul>

  <script>
    fetch('/products')
      .then(r => r.json())
      .then(data => {
        const ul = document.getElementById('list');
        data.forEach(p => {
          const li = document.createElement('li');
          li.textContent = `${p.name} - $${p.price}`;
          ul.appendChild(li);
        });
      });
  </script>
</body>
</html>
