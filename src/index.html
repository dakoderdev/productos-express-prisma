<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Productos APP ORM</title>
</head>
<body>
  <nav>
    <ul class="menu__ul">
      <li>
        <a class="menu__a--current" href="index.html">Productos</a>
      </li>
      <li>
        <a href="orden.html">Ordenes</a>
      </li>
    </ul>
    <button class="nav__button">
      <img class="nav__user-img" src="https://i.pravatar.cc/300?img=57" alt="Foto de Perfil">
    </button>
  </nav>
  <main><ul id="list__product"></ul></main>

  <script>
  fetch('/products')
    .then(r => r.json())
    .then(data => {
      const ul = document.getElementById('list__product'); 

      data.forEach(p => {
        const price = p.price.toLocaleString("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 }).replace(/\s/g, '');
        const li = document.createElement('li');
        li.className = 'li__card';

        li.innerHTML = `
          <div>
          <span class="li__name">${p.name}</span>
          <span class="li__tag">${p.category.name}</span>
          </div>
          <div>
          <span class="li__price">${price}</span>
          <button class="li__button">Agregar al carrito</button>
          </div>
        `;
        ul.appendChild(li);
      });
    });
</script>
</body>
</html>
